name: VPNChainSetup
options:
  bundleIdPrefix: ru.vpnchain
  developmentLanguage: ru
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  VPNChainCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: "NO"

targets:
  VPNChainSetup:
    type: application
    platform: macOS
    sources:
      - path: Sources/VPNChainSetup
    dependencies:
      - package: VPNChainCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/VPNChainSetup/Info.plist
      properties:
        CFBundleDisplayName: VPN Chain Setup
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""

schemes:
  VPNChainSetup:
    build:
      targets:
        VPNChainSetup: all
